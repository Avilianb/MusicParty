server:
  port: 8080
  # 子路径部署（例如 nginx 反代到 https://host/party/）时设为 /party；本地或站点根部署留空
  servlet:
    context-path: ${APP_CONTEXT_PATH:}

# Logging configuration
logging:
  level:
    # Set the root logger to INFO
    root: INFO
    # Set our application's package to DEBUG for more detailed logs during development
    org.thornex.musicparty: DEBUG

# Custom application properties
app:
  music-api:
    admin-password: ${ADMIN_PASSWORD:admin123}
    base-url: ${BASE_URL:http://localhost:8080}
    author-name: ${APP_AUTHOR_NAME:ThorNex}
    back-words: ${APP_BACK_WORDS:THORNEX}
    mp:
      # 自建音源（自己服务器上的 QQ 音乐 API，panel 的 /mp/* 路由）
      # base-url: 容器/本机内网地址，后端调用元数据、预热、歌词走它
      base-url: ${MP_API_URL:http://127.0.0.1:8321}
      # public-base-url: 浏览器可达地址（可为空 → 回退 base-url）。反代场景填 nginx 上的对外地址
      public-base-url: ${MP_PUBLIC_URL:}
      # 服务端 /mp/* 的访问令牌（provider.json 中 mp.token）
      token: ${MP_API_TOKEN:}
      enabled: ${MP_ENABLED:true}
      timeout-seconds: ${MP_TIMEOUT_SECONDS:10}
    queue:
      max-size: ${QUEUE_MAX_SIZE:1000}
      history-size: ${QUEUE_HISTORY_SIZE:50}
      max-user-songs: ${QUEUE_MAX_USER_SONGS:100}
    player:
      max-playlist-import-size: ${PLAYLIST_IMPORT_LIMIT:100}
      sync-broadcast-interval-ms: ${SYNC_BROADCAST_INTERVAL_MS:5000}
    chat:
      max-history-size: ${CHAT_HISTORY_LIMIT:1000}
      min-interval-ms: ${CHAT_MIN_INTERVAL:1000}
      max-message-length: ${CHAT_MAX_LENGTH:200}
    stream:
      max-clients: ${STREAM_MAX_CLIENTS:100}
      buffer-chunks: ${STREAM_BUFFER_CHUNKS:32}
      chunk-size-bytes: ${STREAM_CHUNK_SIZE_BYTES:16384}
      seek-threshold-ms: ${STREAM_SEEK_THRESHOLD_MS:3000}
      emitter-timeout-ms: ${STREAM_EMITTER_TIMEOUT_MS:86400000}
    auth:
      rate-limit:
        enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
        max-attempts: ${AUTH_MAX_ATTEMPTS:5}
        window-seconds: ${AUTH_WINDOW_SECONDS:60}
        block-duration-seconds: ${AUTH_BLOCK_DURATION:300}